name: Build

on:
  push:
    branches: [ master ]
    paths-ignore: [ 'repo.json', '**.md', 'openspec/**' ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: windows-2022

    env:
      Solution_Name: CoPose

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Build with dotnet
      run: dotnet build CoPose.slnx --configuration Release

    - name: Test
      run: dotnet test --project CoPose.Tests/CoPose.Tests.csproj --configuration Release --no-build

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CoPose
        path: .\CoPose\bin\x64\Release\CoPose\*
        if-no-files-found: error
        retention-days: 1
